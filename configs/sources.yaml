# Prices, limits and dates, and where each one came from.
#
# Every entry carries the URL it was read from and the date it was retrieved. Nothing in
# the code hard-codes a price: costs are computed from `prices`, and the entry that was used
# (URL and date included) is copied into every run summary. The test lock hashes the entry
# a system uses, so changing a price after locking is caught.
#
# The OpenAI deprecation dates were cross-checked against a saved copy of the page named
# below. The prices and free-tier limits with retrieved_on 2026-10-02 were read from their
# pages on that date; the gpt-oss-120b price and the GPU price come from the project plan
# (2026-10-01) and were not re-read. Re-read a page and update `retrieved_on` before relying
# on a number.
#
# The API systems run on free tiers, so no money is spent: every cost is what the same calls
# would cost at the paid list price below (see billing_basis).

schema_version: 1
billing_basis: "free tier; priced at paid list price"

# --- list prices, USD per 1M tokens ----------------------------------------------------------
prices:
  groq-gpt-oss-20b:
    provider: groq
    model: openai/gpt-oss-20b
    url: https://console.groq.com/docs/model/openai/gpt-oss-20b
    retrieved_on: "2026-10-02"
    usd_per_mtok:
      input: 0.075
      cached_input: 0.037
      output: 0.30

  groq-gpt-oss-120b:
    provider: groq
    model: openai/gpt-oss-120b
    url: https://console.groq.com/docs/model/openai/gpt-oss-120b
    retrieved_on: "2026-10-01"
    usd_per_mtok:
      input: 0.15
      cached_input: 0.075
      output: 0.60

  groq-qwen3.8-27b:
    provider: groq
    model: qwen/qwen3.8-27b
    url: https://console.groq.com/docs/model/qwen/qwen3.8-27b
    retrieved_on: "2026-10-02"
    # The page lists no cached-input price, so no caching discount is assumed.
    usd_per_mtok:
      input: 0.80
      output: 4.00

  google-gemini-3.5-flash-lite:
    provider: google
    model: gemini-3.5-flash-lite
    url: https://ai.google.dev/gemini-api/docs/pricing
    retrieved_on: "2026-10-02"
    usd_per_mtok:
      input: 0.30
      cached_input: 0.03
      output: 2.50

# --- free-tier limits, as published ----------------------------------------------------------
# `observed` stays empty until scripts/check_free_tiers.py has run against the real endpoint.
free_tier_limits:
  groq:
    url: https://console.groq.com/docs/rate-limits
    retrieved_on: "2026-10-02"
    models:
      openai/gpt-oss-20b:
        requests_per_minute: 30
        requests_per_day: 1000
        tokens_per_minute: 8000
        tokens_per_day: 200000
      openai/gpt-oss-120b:
        requests_per_minute: 30
        requests_per_day: 1000
        tokens_per_minute: 8000
        tokens_per_day: 200000
      qwen/qwen3.8-27b:
        requests_per_minute: 30
        requests_per_day: 1000
        tokens_per_minute: 8000
        tokens_per_day: 200000
    observed:
      checked_on: null
      models: null

  gemini:
    url: https://ai.google.dev/gemini-api/docs/rate-limits
    retrieved_on: "2026-10-02"
    # This page defers to AI Studio for free-tier limits. requests_per_day below is as reported
    # for September 2026 by https://www.scriptbyai.com/gemini-api-free-tier-limits/ ("Gemini 3.5
    # Flash-Lite and 3.1 Flash-Lite provide 500"; 3.5 to 3.8 Flash "around 20"). Observed on
    # 2026-10-02: gemini-3.8-flash's 429 error gave quotaId
    # GenerateRequestsPerDayPerProjectPerModel-FreeTier, quotaValue 20.
    models:
      gemini-3.5-flash-lite:
        requests_per_minute: null
        requests_per_day: 500
    observed:
      checked_on: null
      models: null

# --- GPU rental, USD per hour -----------------------------------------------------------------
gpu_rental:
  aws-g4dn.xlarge:
    gpu: "1x NVIDIA T4"
    url: https://instances.vantage.sh/aws/ec2/g4dn.xlarge
    retrieved_on: "2026-10-01"
    usd_per_hour:
      on_demand: 0.526
      spot: 0.274

# --- OpenAI fine-tuning and evals deprecations --------------------------------------------------
# Context for why this comparison is published when it is.
openai_deprecations:
  url: https://developers.openai.com/api/docs/deprecations
  retrieved_on: "2026-10-01"
  events:
    - date: "2026-10-23"
      relation: "on"
      what: >-
        Fine-tuned models shut down: ft-gpt-3.5-turbo, ft-gpt-4, ft-gpt-4.1-nano-2025-04-14,
        ft-babbage-002, ft-davinci-002 and ft-o4-mini-2025-04-16.
    - date: "2026-10-31"
      relation: "from"
      what: Evals become read-only.
    - date: "2026-11-30"
      relation: "on"
      what: Evals shut down.
    - date: "2027-01-06"
      relation: "from"
      what: >-
        Active existing customers can no longer create new fine-tuning jobs. Inference on
        existing fine-tuned models continues until their base model is deprecated.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Python 3.11 only (pyproject.toml pins >=3.11,<3.12). The tests are self-contained: CI
      # needs no dataset, no GPU, no model download and no API key. Tests that use the real
      # data or the embedding model skip themselves when those are absent.
      - name: Create the environment
        run: |
          uv venv --python 3.11
          uv pip install -r requirements.txt
          uv pip install -e . --no-deps

      - name: Tests
        run: .venv/bin/pytest -q

      - name: Lint
        run: .venv/bin/ruff check .

      # The README results region, hf/README.md and docs/writeup.md are generated from the
      # committed results and configs. This fails, naming the file, if one is out of date; fix it
      # with `python scripts/render.py --target all` and commit the result. It reads only files
      # in the repository, so it needs no dataset, no GPU and no API key.
      - name: Generated docs are up to date
        run: .venv/bin/python scripts/render.py --target all --check
